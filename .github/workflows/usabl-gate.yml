name: usabl-gate

on:
  pull_request:
    branches: [main]
    # Retargeting onto main must re-run trusted-ref policy checks.
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    # Use the event payload so a review still knows the base branch and head SHA.
    types: [submitted, edited, dismissed]

permissions:
  contents: read

jobs:
  gate-comment:
    # The scan starts the fixture, and npm run dev executes PR head code. Only a
    # pull_request event denies secrets to fork head code, so fence the scan to it.
    # A pull_request_review event carries base-repo secrets and must never run head code.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Checkout fixture repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout trusted usabl engine commit
        # For now: usabl is not a published package, so clone the private repo.
        # Later: npm install usabl@0.2.0 from the registry. Drop this checkout and the token.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: usabl-dev/usabl
          ref: e3ef958266727382f99030420942abf23db38751
          path: .usabl-engine
          token: ${{ secrets.USABL_ENGINE_CHECKOUT_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .usabl-engine/package-lock.json

      - name: Install and build trusted engine
        working-directory: .usabl-engine
        run: npm ci && npm run build

      - name: Install Chromium for engine checks
        working-directory: .usabl-engine
        run: npx playwright install --with-deps chromium

      - name: Snapshot trusted engine for gate execution
        run: |
          # This part stays: the checker must not live where npm run dev can overwrite it.
          # For now the source is the git clone above. Later the source is npm install usabl.
          sudo cp -a "$GITHUB_WORKSPACE/.usabl-engine" /opt/usabl-trusted
          sudo chown -R root:root /opt/usabl-trusted
          sudo chmod -R a-w /opt/usabl-trusted
          sudo chmod -R a+rX /opt/usabl-trusted

      - name: Install fixture dependencies for CI
        run: |
          # For now the lockfile pins usabl as file:../usabl, and Actions has no sibling folder.
          # Later: npm ci installs usabl from the registry. Drop this symlink.
          # Use --ignore-scripts so PR lifecycle hooks do not run during fixture dependency installation.
          ln -sfn "$GITHUB_WORKSPACE/.usabl-engine" "$GITHUB_WORKSPACE/../usabl"
          npm ci --ignore-scripts

      - name: Start fixture on localhost
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/usabl-vite.log 2>&1 &
          echo "VITE_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for fixture readiness
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:5173" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "fixture did not start on 127.0.0.1:5173"
          cat /tmp/usabl-vite.log
          exit 1

      - name: Fetch trusted base ref when absent
        run: |
          if ! git rev-parse --verify --quiet "origin/${BASE_REF}" > /dev/null; then
            git fetch origin "${BASE_REF}" --depth=1
          fi

      - name: Run usabl check against trusted base-ref policy
        id: usabl
        run: |
          code=0
          # Keep || code=$? on the same line, because a next-line $? becomes 0 under set -e.
          # trusted-ref points to origin/${BASE_REF} so a PR cannot rewrite policy and pass itself.
          node /opt/usabl-trusted/dist/cli.js check --ci --trusted-ref "origin/${BASE_REF}" --json > usabl-result.json || code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"

      - name: Stop fixture server
        if: always()
        run: |
          if [ -n "${VITE_PID:-}" ]; then
            kill "${VITE_PID}" || true
          fi

      - name: Validate Result JSON
        env:
          USABL_EXIT: ${{ steps.usabl.outputs.exit_code }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('usabl-result.json', 'utf8'));
          const capturedExit = Number(process.env.USABL_EXIT);

          if (result.schemaVersion !== 'usabl.result.v1') {
            throw new Error('usabl produced an unsupported Result schema');
          }
          if (!Number.isInteger(result.exitCode)) {
            throw new Error('usabl Result has no integer exit code');
          }
          if (!Number.isInteger(capturedExit) || result.exitCode !== capturedExit) {
            throw new Error('usabl Result exit code does not match the process exit code');
          }
          if (result.accessibilityExitCode === 2) {
            throw new Error('accessibilityExitCode cannot be 2');
          }
          NODE

      - name: Render and validate comment Markdown
        env:
          USABL_EXIT: ${{ steps.usabl.outputs.exit_code }}
        run: |
          code=0
          node /opt/usabl-trusted/dist/cli.js comment < usabl-result.json > usabl-comment.md || code=$?
          if [ "${code}" -ne "${USABL_EXIT}" ]; then
            echo "comment renderer exit code does not match the Result exit code"
            exit 1
          fi
          if [ ! -s usabl-comment.md ]; then
            echo "comment renderer produced no markdown"
            exit 1
          fi
          node -e "const fs = require('node:fs'); const body = fs.readFileSync('usabl-comment.md', 'utf8'); if (!body.includes('<!-- usabl-report -->')) throw new Error('comment markdown has no usabl marker');"

      - name: Post sticky PR comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- usabl-report -->';
            const body = fs.readFileSync('usabl-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload Result JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usabl-result
          path: usabl-result.json
          if-no-files-found: error
          retention-days: 1

      - name: Enforce accessibility
        env:
          USABL_EXIT: ${{ steps.usabl.outputs.exit_code }}
        run: |
          if [ -z "${USABL_EXIT}" ]; then
            echo "usabl produced no exit code; failing closed."
            exit 1
          fi
          # Never exit 2 here. Guarded-file approval lives on usabl-policy.
          node /opt/usabl-trusted/dist/cli.js enforce accessibility < usabl-result.json

  usabl-policy:
    # The policy verdict, and the job that resolves the Result artifact for this head. It
    # re-runs on pull_request_review so a CODEOWNERS approval or dismissal flips the gate.
    # Review events carry base-repo secrets, so this job must never check out or execute PR
    # head code. It reads the head only as git objects and decides from the trusted base ref,
    # CODEOWNERS, and the reviews API. Do not make this the required check on its own: it
    # returns success whenever no guarded path diverged, which says nothing about
    # accessibility. usabl-required is the check to require.
    needs: gate-comment
    if: always()
    runs-on: ubuntu-latest
    outputs:
      # The accessibility verdict travels to usabl-required as data. Inferring it from a job
      # status would be a second verdict path, and on a review event the scan job is skipped
      # so there is no status to infer it from.
      accessibility: ${{ steps.accessibility.outputs.verdict }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout trusted base-ref policy
        # Check out the base commit, never the PR head. This working tree is trusted.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch base ref and head objects without checkout
        run: |
          # PR_NUMBER comes from the event as an integer. Guard it anyway before it
          # reaches a ref path, so a malformed value can never inject a fetch refspec.
          case "${PR_NUMBER}" in
            ''|*[!0-9]*)
              echo "pull request number is not numeric; failing closed"
              exit 1
              ;;
          esac
          # Bring origin/${BASE_REF} for the trusted-ref diff, and the PR head as
          # objects only. enforce policy reads blob contents with git show and
          # git ls-tree, which never check out or execute the head, so no PR code runs.
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"

      - name: Checkout trusted usabl engine commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: usabl-dev/usabl
          ref: e3ef958266727382f99030420942abf23db38751
          path: .usabl-engine
          token: ${{ secrets.USABL_ENGINE_CHECKOUT_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .usabl-engine/package-lock.json

      - name: Install and build trusted engine
        working-directory: .usabl-engine
        run: npm ci && npm run build

      - name: Resolve the accessibility scan run for this head
        if: github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The scan runs only on pull_request. Find its completed run for this exact
          # head SHA so the re-check consumes a real Result and never scans head code.
          # env.HEAD_SHA is read inside jq, never interpolated into the filter string.
          run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" \
            --workflow usabl-gate.yml --event pull_request --limit 50 \
            --json databaseId,headSha,status \
            --jq '[.[] | select(.headSha == env.HEAD_SHA and .status == "completed")][0].databaseId')"
          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "no completed accessibility scan for head ${HEAD_SHA}; failing closed"
            exit 1
          fi
          echo "SCAN_RUN_ID=${run_id}" >> "$GITHUB_ENV"

      - name: Download Result JSON from this run
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: usabl-result

      - name: Download Result JSON from the scan run
        if: github.event_name == 'pull_request_review'
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: usabl-result
          run-id: ${{ env.SCAN_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the accessibility verdict from the Result artifact
        id: accessibility
        run: |
          # Publish the accessibility verdict for usabl-required. The scan job runs head code
          # and is fenced to pull_request, so on a review re-run it never runs and there is no
          # job status to read. The Result artifact for this exact head, downloaded above on
          # either event, is the authority instead, and the verdict is the engine's own
          # "enforce accessibility" over it rather than anything re-derived here.
          #
          # This step never fails the job. It reports a verdict and usabl-required decides.
          # The verdict starts at fail and only a clean exit moves it, so a missing, empty, or
          # unparseable artifact stays a fail. A verdict usabl cannot compute is not a pass.
          verdict=fail
          if [ ! -s usabl-result.json ]; then
            echo "no Result JSON for this head; reporting the accessibility verdict as fail"
          else
            code=0
            # Keep || code=$? on the same line, because a next-line $? becomes 0 under set -e.
            node .usabl-engine/dist/cli.js enforce accessibility < usabl-result.json || code=$?
            if [ "${code}" = "0" ]; then
              verdict=pass
            fi
          fi
          echo "accessibility verdict: ${verdict}"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"

      - name: Enforce policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Git refs and CODEOWNERS are the source of truth. The Result on stdin is
          # consumed only for the exit-4 crash short-circuit, never to skip owners.
          node .usabl-engine/dist/cli.js enforce policy --trusted-ref "origin/${BASE_REF}" < usabl-result.json

  usabl-required:
    # THE REQUIRED STATUS CHECK. Require this one in branch protection or your ruleset.
    #
    # Requiring gate-comment or usabl-policy instead leaves a hole. Accessibility is enforced
    # inside gate-comment, which is fenced to pull_request and so cannot be required on a
    # review event, and usabl-policy returns success whenever no guarded path diverged, which
    # says nothing about accessibility. Only this job sees both verdicts.
    #
    # always() is load-bearing. GitHub counts a skipped job as a satisfied required check, so
    # an aggregate that could be skipped would be an open gate. This one always runs and
    # always decides.
    needs: [gate-comment, usabl-policy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Decide the merge gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCAN_RESULT: ${{ needs.gate-comment.result }}
          POLICY_RESULT: ${{ needs.usabl-policy.result }}
          ACCESSIBILITY_VERDICT: ${{ needs.usabl-policy.outputs.accessibility }}
        run: |
          node <<'NODE'
          const event = process.env.EVENT_NAME || '';
          const scan = process.env.SCAN_RESULT || '';
          const policy = process.env.POLICY_RESULT || '';
          const accessibility = process.env.ACCESSIBILITY_VERDICT || '';
          const blockers = [];

          // The scan job runs PR head code, so it is fenced to the pull_request event and cannot run
          // on a review. Its result is an event-shape check here, never a verdict. Requiring success
          // on a review event would break every approval re-run; accepting "not failure" would pass
          // on cancelled and on a scan that never ran. Both are wrong, so neither is written here.
          if (event === 'pull_request') {
            if (scan !== 'success') {
              blockers.push('the accessibility scan job did not succeed on this pull_request event (result: ' + (scan || 'none') + ')');
            }
          } else if (event === 'pull_request_review') {
            if (scan !== 'skipped') {
              blockers.push('the accessibility scan job was not skipped on this pull_request_review event (result: ' + (scan || 'none') + '), so the head-code fence did not hold');
            }
          } else {
            blockers.push('unexpected event ' + (event || 'none') + '; this gate reasons about pull_request and pull_request_review only');
          }

          // usabl-policy resolves the Result artifact for this head on both events, so it is the job
          // that carries both verdicts out. Its outputs mean something only if it finished cleanly:
          // failure, cancelled, and skipped all block.
          if (policy !== 'success') {
            blockers.push('the policy job did not succeed (result: ' + (policy || 'none') + ')');
          }

          // The accessibility verdict is data read from the Result artifact, never inferred from a job
          // status. On a review re-run it is the only accessibility authority that exists, because the
          // scan job is skipped. Only the exact string "pass" passes, so a missing, empty, or
          // unreadable verdict blocks.
          if (accessibility !== 'pass') {
            blockers.push('the accessibility verdict from the Result artifact is not a pass (verdict: ' + (accessibility || 'none') + ')');
          }

          if (blockers.length > 0) {
            console.error('usabl required gate: NOT verified');
            for (const blocker of blockers) {
              console.error('  - ' + blocker);
            }
            process.exit(1);
          }
          console.log('usabl required gate: verified. Accessibility and policy both pass for this head.');
          NODE
